<title>PE Italia Library</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1c2430;--mute:#69758a;--line:#e1e5ec;--brand:#1f3864;--brandsoft:#e8edf7;
--alto:#f4b6a0;--medio:#ffe08a;--basso:#bfe0b0;--nd:#d9dde3;--usc:#b9d3ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--panel:#1a2029;--ink:#e6eaf0;--mute:#93a0b4;--line:#2a3340;--brand:#8fb0ee;--brandsoft:#222c3d;
--alto:#7a3b2a;--medio:#6e5a16;--basso:#35572b;--nd:#3a424e;--usc:#2c4b6e}}
:root[data-theme="dark"]{--bg:#12161d;--panel:#1a2029;--ink:#e6eaf0;--mute:#93a0b4;--line:#2a3340;--brand:#8fb0ee;--brandsoft:#222c3d;--alto:#7a3b2a;--medio:#6e5a16;--basso:#35572b;--nd:#3a424e;--usc:#2c4b6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--brand);color:#fff;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
:root[data-theme="dark"] header,:root:not([data-theme="light"]) header{}
header h1{font-size:17px;margin:0;font-weight:650}
header .sub{opacity:.8;font-size:12px}
header .sp{flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;padding:6px 10px;cursor:pointer}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;align-self:start;position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 0 6px}
aside h3:first-child{margin-top:0}
input[type=search],select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.chk{display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer}
.chk span.n{margin-left:auto;color:var(--mute);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.tab{padding:7px 12px;border:1px solid var(--line);background:var(--panel);border-radius:8px;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.count{color:var(--mute);margin-left:auto}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);cursor:pointer;white-space:nowrap;background:var(--bg)}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--brandsoft)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
.Alto{background:var(--alto)}.Medio{background:var(--medio)}.Basso{background:var(--basso)}.nd{background:var(--nd)}.Usc{background:var(--usc)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--brandsoft);color:var(--brand);margin:1px 2px 1px 0}
.mute{color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.card:hover{border-color:var(--brand)}
.card b{display:block;margin-bottom:4px}
#drawer{position:fixed;top:0;right:0;width:min(560px,100vw);height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.18);transform:translateX(105%);transition:transform .2s;overflow:auto;padding:16px 18px;z-index:10}
#drawer.open{transform:none}
#drawer h2{margin:0 28px 2px 0;font-size:19px}
#drawer .x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;color:var(--mute);cursor:pointer}
.sec{margin-top:16px}
.sec h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 10px}
.kv div:nth-child(odd){color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.kpi small{color:var(--mute);display:block}.kpi b{font-size:18px}
.owner{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.warn{background:var(--medio);padding:6px 9px;border-radius:6px;font-size:12px;margin-top:6px}
a{color:var(--brand)}
footer{padding:14px;text-align:center;color:var(--mute);font-size:12px}
.cm{border-top:1px solid var(--line);padding:8px 0}
textarea,input[type=text]{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:64px;resize:vertical}
.frm{display:grid;gap:6px;margin-top:8px}
.frm .row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btn{padding:7px 12px;border:0;border-radius:6px;background:var(--brand);color:#fff;cursor:pointer;justify-self:start}
:root[data-theme="dark"] .btn{color:#10151c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#10151c}}
.msg{font-size:12px;color:var(--mute);min-height:1em}
.star{border:0;background:none;font-size:18px;line-height:1;cursor:pointer;color:var(--mute);padding:0 4px}
.star.on{color:var(--brand)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
header{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-top:max(12px,env(safe-area-inset-top))}
.mhead,.mfilter,#msort{display:none}
.tabs{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab,.tabs select{white-space:nowrap}
#drawer table{display:block;overflow-x:auto}
.cards{grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr))}
.sec,.owner,.kv>div{overflow-wrap:anywhere}
/* iPad verticale e telefoni: filtri a schermo intero su richiesta */
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;padding:10px max(10px,env(safe-area-inset-left)) 10px max(10px,env(safe-area-inset-right))}
  .mfilter{display:inline-block}
  aside{position:fixed;inset:0;z-index:30;max-height:none;border-radius:0;border:0;padding:0 16px 24px;transform:translateY(102%);transition:transform .22s;visibility:hidden;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:max(24px,env(safe-area-inset-bottom))}
  aside.open{transform:none;visibility:visible}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--panel);padding:max(12px,env(safe-area-inset-top)) 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px;z-index:2}
  .mhead b{font-size:17px}
  #drawer{width:min(560px,100vw)}
}
/* telefoni */
@media(max-width:700px){
  body{font-size:15px}
  header h1{font-size:16px}
  #msort{display:inline-block;width:auto;max-width:48vw}
  #view table,#view thead,#view tbody,#view tr,#view td{display:block}
  #view table{background:none;border:0}
  #view thead{display:none}
  #view tbody tr{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 48px 10px 12px;margin-bottom:8px}
  #view tbody td{border:0;padding:1px 0}
  #view tbody td:nth-child(1){position:absolute;top:2px;right:2px;padding:0}
  #view tbody td:nth-child(2){font-size:16px}
  #view tbody td:nth-child(3){color:var(--mute)}
  #view tbody td:nth-child(5),#view tbody td:nth-child(6),#view tbody td:nth-child(7){display:inline-block;margin:4px 12px 0 0}
  #view tbody td:nth-child(5)::before{content:"Holding ";color:var(--mute);font-size:12px}
  #view tbody td:nth-child(7)::before{content:"Dati fin. ";color:var(--mute);font-size:12px}
  #view tbody td:nth-child(7):empty{display:none}
  .kv{grid-template-columns:105px 1fr}
  .frm .row2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  #drawer h2{margin-right:0;overflow-wrap:anywhere;padding-right:4px}
  #drawer{width:100vw;height:100vh;height:100dvh;border-left:0;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  #drawer .x{position:sticky;float:right;top:0;margin:-4px -4px 0 0;width:44px;height:44px;font-size:28px;background:var(--panel);border-radius:22px;z-index:3}
}
/* dispositivi touch: bersagli da 44px, niente zoom su iOS */
@media(pointer:coarse){
  input[type=search],input[type=text],select,textarea{font-size:16px;min-height:44px}
  textarea{min-height:88px}
  .tab,.btn,header button{min-height:44px;padding:10px 14px}
  .chk{padding:9px 0}
  .chk input{width:22px;height:22px;flex:none}
  .star{font-size:24px;min-width:44px;min-height:44px}
  th{padding:12px 10px}
  a{padding:2px 0}
}
@media(hover:none){tbody tr:hover{background:inherit}}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside{position:fixed}}
</style>
</head>

async function initStore(){

        S.db = db; S.user = user; S.shared = true;
        S.uid = user ? await user.id() : null;
        S.admin = user ? await user.canEdit() : false;
        db.collection("comments").onSnapshot(s => { S.cm = s.docs.map(d => Object.assign({id:d.id}, d.data())); onData(); }, () => onData());
        db.collection("contacts").onSnapshot(s => { S.ct = s.docs.map(d => Object.assign({id:d.id}, d.data())); onData(); }, () => onData());

async function delItem(col, id){

function match(c){
  if (st.ind.size && !st.ind.has(c.industry)) return false;
  if (st.sub && c.sub !== st.sub) return false;
  if (st.pe && !c.owners.some(o => o.pe === st.pe)) return false;
  if (st.ix.size && !c.owners.some(o => st.ix.has(o.idx))) return false;
  const allEx = c.owners.every(o => o.idx === "Uscita avvenuta");
  if (st.status==="ex" && !allEx) return false;
  if (st.status==="cur" && allEx) return false;
  if (st.fin && !c.fin) return false;
  if (st.ev && !c.ev) return false;
  if (st.watch && !S.watch.has(c.key)) return false;
  if (st.q){
    const h = (c.name+" "+c.owners.map(o=>o.pe).join(" ")+" "+(c.overview||"")+" "+c.industry+" "+c.sub).toLowerCase();
    if (!st.q.toLowerCase().split(/\s+/).every(w => h.includes(w))) return false;
  }
  return true;
}

    <div>Holding</div><div>${o.hold==null?"n/d":o.hold.toFixed(1)+" anni"}</div><div>Motivo indice</div><div>${esc(o.why)}</div>${o.deal_type?`<div>Tipo deal</div><div>${esc(o.deal_type)}</div>`:""}
    <div>Fonti</div><div>${esc(o.src.join(", "))}${o.conf?" · confidenza "+esc(o.conf):""} ${link(o.url)}</div></div>${o.notes?`<div class="mute" style="margin-top:4px">${esc(o.notes)}</div>`:""}</div>`).join("")}</div>`;
  if (c.ev||c.adv_sell||c.adv_buy||c.lenders||c.ev_band) h += `<div class="sec"><h4>Deal d'ingresso</h4><div class="kv">${c.ev?`<div>Entry EV</div><div>USD ${fmtNum(c.ev," m")} (Mergermarket)</div>`:""}${c.ev_band?`<div>Fascia valore</div><div>USD m ${esc(c.ev_band)} (dealbook)</div>`:""}${c.adv_sell?`<div>Advisor sell-side</div><div>${esc(c.adv_sell)}</div>`:""}${c.adv_buy?`<div>Advisor buy-side</div><div>${esc(c.adv_buy)}</div>`:""}${c.lenders?`<div>Lender</div><div>${esc(c.lenders)}</div>`:""}${c.region?`<div>Regione</div><div>${esc(c.region)}</div>`:""}</div></div>`;
  h += `<div class="sec"><h4>Dati finanziari / KPI</h4><div class="warn">Dati finanziari non ancora aggiornati: valori parziali e da verificare. In attesa dell'export AIDA.</div>`;
  if (f && (f.revenue_eur_m!=null||f.ebitda_eur_m!=null||f.net_debt_eur_m_or_leverage||f.employees)) {
    const margin = (typeof f.revenue_eur_m==="number" && typeof f.ebitda_eur_m==="number") ? (f.ebitda_eur_m/f.revenue_eur_m*100).toFixed(1)+"%" : null;
    h += `<div class="kpis"><div class="kpi"><small>Ricavi (EUR m)</small><b>${fmtNum(f.revenue_eur_m)}</b></div><div class="kpi"><small>EBITDA (EUR m)</small><b>${fmtNum(f.ebitda_eur_m)}</b></div>${margin?`<div class="kpi"><small>Margine EBITDA</small><b>${margin}</b></div>`:""}${f.employees?`<div class="kpi"><small>Dipendenti</small><b style="font-size:14px">${esc(f.employees)}</b></div>`:""}</div>
    <div class="kv" style="margin-top:8px"><div>Esercizio</div><div>${esc(f.fiscal_year||"n/d")}</div><div>Debito netto / leverage</div><div>${esc(f.net_debt_eur_m_or_leverage||"n/d")}</div><div>Fonte</div><div>${esc(f.source_type||"n/d")} · confidenza ${esc(f.confidence||"n/d")}</div></div>`;
  } else h += `<p class="mute">Nessun dato finanziario disponibile. Da integrare con l'export AIDA.</p>`;
  if (c.bvd && c.bvd.years && c.bvd.years.length) h += bvdTable(c.bvd);
  if (f && f.notes) h += `<div class="warn">${esc(f.notes)}</div>`;
  if (f && f.recent_news) h += `<div class="sec"><h4>Notizie recenti</h4><p>${esc(f.recent_news)}</p></div>`;
  if (f && f.source_urls) h += `<div class="sec"><h4>Link fonti finanziarie</h4>${[].concat(f.source_urls).map(u=>link(u)).filter(Boolean).join("<br>")}</div>`;
  h += `</div>`;
  h += `<div class="sec"><h4>Ultime notizie</h4>${c.press ? `<div class="owner"><b>${esc(c.press.title)}</b><div class="mute">${esc(c.press.date||"data n/d")} · ${esc(c.press.source_name||"")} · ${c.press.type==="press_release"?"comunicato aziendale":"articolo di stampa"}</div><div>${esc(c.press.summary_it||"")}</div>${link(c.press.url)}</div>` : '<p class="mute">Nessuna notizia raccolta per questa società.</p>'}<div class="mute" style="font-size:12px">Cerca ora: ${[["Google News",""],["BeBeez","bebeez.it"],["Milano Finanza","milanofinanza.it"]].map(([n,s]) => `<a href="${newsUrl(c.name,s)}" target="_blank" rel="noopener">${n}</a>`).join(" · ")}</div></div>`;
  h += `<div class="sec"><h4>Commenti del team</h4><div id="cmlist"></div><div class="frm"><textarea id="cmtext" placeholder="Aggiungi un commento…"></textarea><button class="btn" id="cmadd" type="button">Aggiungi commento</button><div class="msg" id="cmmsg"></div><div class="mute" style="font-size:12px">${where()}</div></div></div>`;
  $("dbody").innerHTML = h; $("drawer").classList.add("open");
  $("dbody").querySelectorAll("a[data-pe]").forEach(a => a.onclick = e => { e.preventDefault(); openPE(a.dataset.pe); });
  bindComments(c.key);
  bindWatchBtn(c.key);
  $("ebtn").onclick = () => editCo(id);
  $("dbody").querySelectorAll("a[data-cmp]").forEach(a => a.onclick = e => { e.preventDefault(); if (a.dataset.id !== "") openCo(+a.dataset.id); else openExt(a.dataset.cmp, a.dataset.name); });
}

function openExt(k, name){
  const o = (D.ext || {})[k]; current = null;
  const citing = C.filter(c => c.comp && c.comp.competitors.some(x => x.k === k));
  const cx = citing.length ? citing[0].comp.competitors.find(x => x.k === k) : {};
  let h = `<h2>${esc(name)}</h2><div class="mute">${esc(cx.country || "")}${o && o.hq ? " · " + esc(o.hq) : ""}</div><div class="sec"><h4>Company overview</h4>`;
  if (o && o.description_it) {
    h += `<p>${esc(o.description_it)}</p><div class="kv">${o.founded ? `<div>Fondata</div><div>${esc(o.founded)}</div>` : ""}${o.employees ? `<div>Dipendenti</div><div>${esc(o.employees)}</div>` : ""}${o.revenue ? `<div>Ricavi</div><div>${esc(o.revenue)}</div>` : ""}${o.ownership ? `<div>Proprietà</div><div>${esc(o.ownership)}</div>` : ""}${o.website ? `<div>Sito</div><div>${link(/^https?:/i.test(o.website) ? o.website : "https://" + o.website)}</div>` : ""}<div>Fonte</div><div>${link(o.source_url) || "n/d"} · confidenza ${esc(o.confidence || "n/d")}</div></div>${o.confidence === "Low" ? '<div class="warn">Identificazione incerta: verificare che sia la società giusta.</div>' : ""}`;
  } else {
    h += '<p class="mute">Overview non ancora raccolta per questa società.</p>';
  }
  const q = encodeURIComponent('"' + name + '"');
  h += `<div class="mute" style="font-size:12px;margin-top:6px">Cerca ora: <a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Google</a> · <a href="https://it.wikipedia.org/w/index.php?search=${encodeURIComponent(name)}" target="_blank" rel="noopener">Wikipedia</a> · <a href="${newsUrl(name, "")}" target="_blank" rel="noopener">Google News</a></div></div>`;
  h += `<div class="sec"><h4>Citata come concorrente di</h4>${citing.map(c => `<div class="owner" data-id="${c.id}" style="cursor:pointer"><b>${esc(c.name)}</b><div class="mute">${esc((c.comp.competitors.find(x => x.k === k) || {}).why || "")}</div></div>`).join("") || '<p class="mute">n/d</p>'}<div class="mute" style="font-size:12px">I concorrenti sono indicati da conoscenza generale e non sono verificati.</div></div>`;
  $("dbody").innerHTML = h; $("drawer").classList.add("open");
  $("dbody").querySelectorAll(".owner[data-id]").forEach(el => el.onclick = () => openCo(+el.dataset.id));
}

function openPE(p){
  const l = peMap[p]; let h = `<h2>${esc(p)}</h2><div class="mute">${l.length} società nel database</div><div class="sec"><h4>Portfolio</h4>`;
  h += l.slice().sort((a,b)=>rank[a.owners.find(o=>o.pe===p).idx]-rank[b.owners.find(o=>o.pe===p).idx]||a.name.localeCompare(b.name)).map(c=>{
    const o = c.owners.find(x=>x.pe===p);
    return `<div class="owner" style="cursor:pointer" data-id="${c.id}"><b>${esc(c.name)}</b> ${pill(o.idx)}<div class="mute">${esc(c.industry)} · ${esc(c.sub)} · ${esc(o.status)}${o.entry?" · ingresso "+esc(o.entry):""}</div></div>`;}).join("");
  h += `</div>`;
  h += `<div class="sec"><h4>Persone che conosciamo</h4><div id="ctlist"></div><div class="frm"><div class="row2"><input type="text" id="ctname" placeholder="Nome e cognome"><input type="text" id="ctrole" placeholder="Ruolo"></div><div class="row2"><input type="text" id="ctap" placeholder="Contatto diretto AP (chi di noi)"><input type="text" id="ctnote" placeholder="Note"></div><button class="btn" id="ctadd" type="button">Aggiungi persona</button><div class="msg" id="ctmsg"></div><div class="mute" style="font-size:12px">${where()}</div></div></div>`;
  $("dbody").innerHTML = h; $("drawer").classList.add("open");
  $("dbody").querySelectorAll("[data-id]").forEach(el => el.onclick = () => openCo(+el.dataset.id));
  bindContacts(slug(p));
}

$("close").onclick = () => { $("drawer").classList.remove("open"); current = null; };
document.addEventListener("keydown", e => { if (e.key==="Escape") { $("drawer").classList.remove("open"); current = null; } });
$("q").oninput = e => { st.q = e.target.value; render(); };
$("pe").onchange = e => { st.pe = e.target.value; render(); };
$("sub").onchange = e => { st.sub = e.target.value; render(); };
$("st").onchange = e => { st.status = e.target.value; render(); };
$("fin").onchange = e => { st.fin = e.target.checked; render(); };
$("ev").onchange = e => { st.ev = e.target.checked; render(); };
$("wl").onchange = e => { st.watch = e.target.checked; render(); };
$("ind").onchange = e => { const i = e.target.dataset.i; e.target.checked ? st.ind.add(i) : st.ind.delete(i); fillSub(); render(); };
$("ix").onchange = e => { const i = e.target.dataset.x; e.target.checked ? st.ix.add(i) : st.ix.delete(i); render(); };
document.querySelectorAll(".tab[data-v]").forEach(b => b.onclick = () => { document.querySelectorAll(".tab[data-v]").forEach(x=>x.classList.remove("on")); b.classList.add("on"); st.view=b.dataset.v; render(); });
$("reset").onclick = () => { st.q=""; st.pe=""; st.ind.clear(); st.sub=""; st.status=""; st.ix.clear(); st.fin=false; st.ev=false; st.watch=false; st.focus.clear(); $("wl").checked=false;
  $("q").value=""; $("pe").value=""; $("st").value=""; $("fin").checked=false; $("ev").checked=false;
  document.querySelectorAll("#ind input,#ix input").forEach(x=>x.checked=false); fillSub(); render(); };
applyAllOv(); render(); initStore();

// --- adattamento a telefono / tablet ---
(function(){
  const aside = $("filters"), drawer = $("drawer");
  const nAct = () => (st.q?1:0)+(st.pe?1:0)+st.ind.size+(st.sub?1:0)+(st.status?1:0)+st.ix.size+(st.fin?1:0)+(st.ev?1:0)+(st.watch?1:0);
  const upd = () => {
    const n = nAct(); $("fopen").textContent = "Filtri" + (n ? " (" + n + ")" : "");
    const k = $("cnt").textContent.replace(/\D+.*$/,""); $("fclose").textContent = k ? "Mostra " + k + " risultati" : "Mostra risultati";
    $("msort").value = st.sort;
  };
  $("fopen").onclick = () => { aside.classList.add("open"); document.body.classList.add("lock"); };
  $("fclose").onclick = () => { aside.classList.remove("open"); document.body.classList.remove("lock"); window.scrollTo(0,0); };
  $("msort").onchange = e => { st.sort = e.target.value; st.dir = 1; render(); };
  new MutationObserver(upd).observe($("cnt"), {childList:true, characterData:true, subtree:true});
  new MutationObserver(() => { document.body.classList.toggle("lock", drawer.classList.contains("open") || aside.classList.contains("open")); })
    .observe(drawer, {attributes:true, attributeFilter:["class"]});
  window.addEventListener("resize", () => { if (innerWidth > 900) { aside.classList.remove("open"); document.body.classList.remove("lock"); } });
  upd();
})();

</script>
</body>
</html>
